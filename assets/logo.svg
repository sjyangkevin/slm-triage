<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <style>
    .text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      font-weight: 800;
      font-size: 34px;
      letter-spacing: -1.5px;
    }
    .text-slm { fill: #24292f; }
    .text-triage { fill: #57606a; }
    
    @media (prefers-color-scheme: dark) {
      .text-slm { fill: #ffffff; }
      .text-triage { fill: #aaaaaa; }
    }
  </style>

  <text x="10" y="42" class="text" font-style="italic">
    <tspan class="text-slm">SLM</tspan>
    <tspan class="text-triage" dx="4">Triage</tspan>
  </text>
</svg>
