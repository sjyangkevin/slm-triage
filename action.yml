name: 'SLM Triage'
description: >
  Triage incoming Issues and Pull Requests by running a small local LLM
  that scores submissions against your project's contribution guidelines.
author: 'Kevin Yang'

branding:
  icon: 'shield'
  color: 'purple'

inputs:
  github-token:
    description: 'GitHub token for API calls.'
    required: true
  ollama-model:
    description: 'Ollama model to use for inference.'
    default: 'qwen3.5:2b'
  ollama-think:
    description: 'Set to "true" if the model natively supports reasoning outputs (e.g. deepseek-r1).'
    default: 'false'
  review-label:
    description: 'Label to apply to submissions that need more information.'
    default: 'needs-details'
  actions:
    description: 'Comma-separated list of actions to take (e.g., "comment,label,close").'
    default: 'comment,label'
  include-pr-diff:
    description: 'Include the pull request code diff in the evaluation.'
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Install Python dependencies
      shell: bash
      run: uv pip install --system ${{ github.action_path }}

    - name: Install Ollama
      shell: bash
      run: curl -fsSL https://ollama.com/install.sh | sh

    - name: Cache Ollama model
      id: cache-model
      uses: actions/cache@v4
      with:
        path: ~/.ollama/models
        key: ollama-${{ inputs.ollama-model }}

    - name: Start Ollama server
      shell: bash
      run: |
        ollama serve &
        for i in $(seq 1 30); do
          if curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
            echo "Ollama server is ready."
            break
          fi
          echo "Waiting for Ollama server... ($i/30)"
          sleep 1
        done

    - name: Pull LLM model
      if: steps.cache-model.outputs.cache-hit != 'true'
      shell: bash
      run: ollama pull ${{ inputs.ollama-model }}

    - name: Run triage
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        OLLAMA_MODEL: ${{ inputs.ollama-model }}
        OLLAMA_THINK: ${{ inputs.ollama-think }}
        INPUT_REVIEW_LABEL: ${{ inputs.review-label }}
        INPUT_ACTIONS: ${{ inputs.actions }}
        INPUT_INCLUDE_PR_DIFF: ${{ inputs.include-pr-diff }}
      run: python ${{ github.action_path }}/src/main.py
