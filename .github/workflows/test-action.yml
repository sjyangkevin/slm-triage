name: Test SLM Triage Action

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

jobs:
  slm-triage:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Triage Assistant
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
