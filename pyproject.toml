[project]
name = "slm-triage"
version = "0.1.0"
description = "A GitHub Action that triages Issues and PRs using a local Small Language Model."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "requests>=2.31",
    "tenacity>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "prek",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
